<!doctype html>
<html lang="es">
  <head>
    <link rel="stylesheet" href="/src/estilos.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proyecto Coworking</title>
  </head>
  <body>
  <main class="contenedor">
    <section class="tarjeta">
      <div class="titulo-fila">
        <h2>Mis Tareas</h2>
        <a href="#" class="ver-todas">Ver todas →</a>
      </div>

      <div class="formulario">
        <input id="titulo" placeholder="Título" />
        <input id="descripcion" placeholder="Descripción" />
        <input id="fecha" type="date" />
        <select id="prioridad">
          <option value="alta">Alta</option>
          <option value="media" selected>Media</option>
          <option value="baja">Baja</option>
        </select>
        <button id="boton-crear" class="boton boton-primario">Crear tarea</button>
      </div>

      <p id="error" class="error"></p>
      <ul id="listaTareas" class="lista"></ul>
    </section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
